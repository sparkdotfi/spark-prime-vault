[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "test/tables" },
]

[fuzz]
runs = 1000

[invariant]
fail_on_revert = true

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
