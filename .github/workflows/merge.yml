name: Merge CI

on:
    workflow_dispatch:
    push:
        branches:
            - master
            - dev

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: v1.5.1

            - name: Build contracts
              run: |
                  forge --version
                  forge build --sizes

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: v1.5.1

            - name: Run tests
              env:
                  MAINNET_RPC_URL: ${{secrets.MAINNET_RPC_URL}}
              run: FOUNDRY_PROFILE=master-ci forge test
